# Builds ready-to-run apps for Windows and Mac.
# Runs when a version tag like v0.1 is pushed (or by hand from the Actions tab),
# and attaches the downloads to a GitHub Release for that tag.
#
# The outline templates are NOT in the code. They live as templates.zip on a
# release tagged "templates" (in TEMPLATES_REPO) and are added to the apps at build
# time. If the templates ever have to move, change TEMPLATES_REPO; to build without
# them, set it to "none".
name: Build apps

env:
  TEMPLATES_REPO: ${{ github.repository }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: pip install -r requirements.txt pyinstaller

      - name: Get outline templates
        if: env.TEMPLATES_REPO != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download templates --repo "$TEMPLATES_REPO" --pattern templates.zip
          python -m zipfile -e templates.zip templates
          echo "TEMPLATE_DATA=--add-data templates${{ runner.os == 'Windows' && ';' || ':' }}templates" >> "$GITHUB_ENV"

      - name: Build Windows app
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Binary Art Generator" \
            --add-data "pk_reader;pk_reader" $TEMPLATE_DATA binary_art_generator_p1.py
          mv "dist/Binary Art Generator.exe" Binary-Art-Generator-Windows.exe

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Binary Art Generator" \
            --add-data "pk_reader:pk_reader" $TEMPLATE_DATA binary_art_generator_p1.py
          ditto -c -k --keepParent "dist/Binary Art Generator.app" Binary-Art-Generator-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: Binary-Art-Generator-*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Binary-Art-Generator-*
